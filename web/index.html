<!doctype html>
<!-- TensorLupa — Copyright 2026 Alex Anokhin — Apache License 2.0 (LICENSE, NOTICE) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TensorLupa — a magnifying glass for neural networks</title>
<meta name="author" content="Alex Anokhin">
<meta name="description" content="TensorLupa runs a real language model in your browser and shows every step of its work: which words it weighed, which one it picked, and where it was looking.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="media/apple-touch-icon.png">
<script>
// старые ссылки на эксперименты вели на главную (/?w=…&seed=…) — отправляем их в студию с теми же параметрами
(function () {
  var q = new URLSearchParams(location.search);
  if (['w', 'p', 'seed', 's', 't', 'k', 'mode'].some(function (k) { return q.has(k); })) location.replace('studio' + location.search);
})();
</script>
<link rel="stylesheet" href="landing.css">
<script src="i18n/en.js"></script>
<script src="i18n/ru.js"></script>
</head>
<body>
<header class="bar">
  <a class="logo" href="./"><img class="logo-mark" src="media/logo.svg" alt="" width="26" height="26">TensorLupa</a>
  <nav class="bar-links">
    <a href="https://github.com/olanokhin/tensorlupa" rel="noopener">GitHub</a>
    <button id="lang" class="lang-btn" type="button"></button>
  </nav>
</header>

<main>
  <section class="hero">
    <div class="hero-text">
      <h1 data-i18n="land.h1"></h1>
      <p class="lede" data-i18n="land.lede"></p>
      <div class="cta">
        <a class="btn-open" href="studio" data-i18n="land.open"></a>
        <p class="cta-note" data-i18n="land.free"></p>
      </div>
      <div class="phone">
        <p data-i18n="land.phone"></p>
        <div class="phone-row">
          <code class="phone-url">tensorlupa.vercel.app</code>
          <button id="copy" class="btn-open btn-small" type="button" data-i18n="land.copy"></button>
          <button id="share" class="btn-ghost btn-small" type="button" data-i18n="land.share" hidden></button>
        </div>
      </div>
    </div>

    <figure class="trace" aria-labelledby="trace-cap">
      <figcaption id="trace-cap" data-i18n="land.trace.cap"></figcaption>
      <p class="trace-text" id="trace-text"></p>
      <div class="trace-chose">
        <div class="tc-label" data-i18n="land.trace.chose"></div>
        <ol class="tc-list" id="tc-list"></ol>
      </div>
      <p class="trace-hint" id="trace-hint" data-i18n="land.trace.hint"></p>
    </figure>
  </section>

  <section class="film">
    <video src="media/demo.mp4" poster="media/demo-poster.jpg" muted loop playsinline preload="none" id="film"></video>
    <p class="film-cap" data-i18n="land.video.cap"></p>
  </section>

  <section class="see">
    <h2 data-i18n="land.see.h"></h2>
    <div class="see-grid">
      <div><h3 data-i18n="land.see.1.h"></h3><p data-i18n="land.see.1"></p></div>
      <div><h3 data-i18n="land.see.2.h"></h3><p data-i18n="land.see.2"></p></div>
      <div><h3 data-i18n="land.see.3.h"></h3><p data-i18n="land.see.3"></p></div>
    </div>
  </section>

  <section class="inst">
    <h2 data-i18n="land.inst.h"></h2>
    <p class="inst-lede" data-i18n="land.inst"></p>
    <p class="inst-cap" data-i18n="land.inst.cap"></p>
    <ol class="inst-steps">
      <li><span class="is-n" data-i18n="land.inst.1.n"></span><span class="is-bar"><i style="width:5.7%"></i></span><span data-i18n="land.inst.1"></span></li>
      <li><span class="is-n" data-i18n="land.inst.2.n"></span><span class="is-bar"><i style="width:64%"></i></span><span data-i18n="land.inst.2"></span></li>
      <li class="best"><span class="is-n" data-i18n="land.inst.3.n"></span><span class="is-bar"><i style="width:100%"></i></span><span data-i18n="land.inst.3"></span></li>
    </ol>
  </section>

  <section class="chain">
    <h2 data-i18n="land.chain.h"></h2>
    <p class="chain-lede" data-i18n="land.chain.lede"></p>
    <ol class="chain-steps">
      <li><span class="cs-n" data-i18n="land.chain.1.n"></span><h3 data-i18n="land.chain.1.h"></h3><p data-i18n="land.chain.1"></p></li>
      <li><span class="cs-n" data-i18n="land.chain.2.n"></span><h3 data-i18n="land.chain.2.h"></h3><p data-i18n="land.chain.2"></p></li>
      <li><span class="cs-n" data-i18n="land.chain.3.n"></span><h3 data-i18n="land.chain.3.h"></h3><p data-i18n="land.chain.3"></p></li>
      <li><span class="cs-n" data-i18n="land.chain.4.n"></span><h3 data-i18n="land.chain.4.h"></h3><p data-i18n="land.chain.4"></p></li>
      <li class="here"><span class="cs-n" data-i18n="land.chain.5.n"></span><h3 data-i18n="land.chain.5.h"></h3><p data-i18n="land.chain.5"></p></li>
    </ol>
  </section>

  <section class="expect">
    <h2 data-i18n="land.expect.h"></h2>
    <p data-i18n="land.expect"></p>
    <div class="cta cta-end">
      <a class="btn-open" href="studio" data-i18n="land.open"></a>
    </div>
  </section>
</main>

<footer class="foot">
  <p data-i18n="land.by"></p>
  <nav>
    <a href="https://github.com/olanokhin/tensorlupa" rel="noopener">GitHub</a>
    <a href="https://www.linkedin.com/in/olanokhin/" rel="noopener">LinkedIn</a>
    <a href="https://huggingface.co/olanokhin" rel="noopener">Hugging Face</a>
    <a href="https://olanokhin.com" rel="noopener">olanokhin.com</a>
  </nav>
</footer>

<script>
// язык — так же, как в студии: сохранённый выбор → язык браузера → английский; тексты до первой отрисовки
(function () {
  var D = window.MQ_DICTS || {}, saved = null, L = null;
  try { saved = localStorage.getItem('mq.lang'); } catch (e) { /* нет хранилища */ }
  if (saved && D[saved]) L = saved;
  if (!L) {
    var prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
    for (var i = 0; i < prefs.length && !L; i++) { var c = String(prefs[i]).slice(0, 2).toLowerCase(); if (D[c]) L = c; }
  }
  window.MQ_LANG = L || 'en';
  var d = D[window.MQ_LANG] || {}, en = D.en || {};
  function g(k) { var v = d[k] !== undefined ? d[k] : en[k]; return typeof v === 'string' ? v : k; }
  document.documentElement.lang = window.MQ_LANG;
  document.title = g('land.title');
  document.querySelectorAll('[data-i18n]').forEach(function (e) { e.textContent = g(e.dataset.i18n); });
})();
</script>
<script type="module" src="landing.js"></script>
</body>
</html>

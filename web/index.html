<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>micro-qwen3 editor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%222%22 y=%222%22 width=%2212%22 height=%2212%22 rx=%223%22 fill=%22%23f2b33d%22/%3E%3Crect x=%225%22 y=%225%22 width=%226%22 height=%226%22 rx=%221%22 fill=%22%23a98cf0%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="editor.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand">micro-qwen3 <span>editor</span></div>
    <div class="order">
      <select id="mode" title="Режим">
        <option value="order">Заказ истории</option>
        <option value="continue">Продолжить текст</option>
      </select>
      <input id="words" type="text" value="dragon, cookie, school" placeholder="до трёх слов: глагол, существительное, прилагательное" spellcheck="false">
      <input id="prompt" type="text" value="Once upon a time" placeholder="начало истории" spellcheck="false" hidden>
      <button id="gen" class="primary">Сгенерировать</button>
    </div>
    <div id="status" class="status">загрузка модели…</div>
  </header>

  <section id="view-model" class="viewport">
    <div class="vp-title vp-tabs" title="Поток слева направо. Мышь — вращать, колесо — приблизить, щелчок по пластине — разобрать слой">Модель
      <button class="tab on" data-view="3d">3D</button><button class="tab" data-view="schema">схема</button>
      <label class="explode" id="spread-box">раздвинуть <input id="spread" type="range" min="0.6" max="2" step="0.01" value="1"></label>
      <button class="tab on" id="wires-tog" title="линии сильнейших путей между пластинами">линии</button>
      <span class="cams" id="cams"><button class="tab cam on" data-cam="perspective">перспектива</button><button class="tab cam" data-cam="side">сбоку</button><button class="tab cam" data-cam="along">вдоль потока</button></span>
      <span id="model-sub" hidden>· поток слева направо · мышь — вращать</span></div>
    <div class="vp-body"><div id="model-3d" class="fill"></div><canvas id="model-canvas" class="fill" hidden></canvas></div>
  </section>

  <section id="view-attn" class="viewport">
    <div class="vp-title vp-tabs">Attention
      <button class="tab on" data-aview="3d">3D</button><button class="tab" data-aview="2d">2D</button>
      <span class="amodes"><button class="tab amode on" data-amode="look" title="вес внимания: куда голова смотрит">куда смотрит</button><button class="tab amode" data-amode="contrib" title="вес × сила value: что реально забрано из токена">вклад</button></span>
      <label class="explode" id="explode-box">раздвинуть <input id="explode" type="range" min="0" max="1" step="0.01" value="0.25"></label>
      <span id="attn-sub">· щёлкни карту — подсветить историю</span></div>
    <div class="vp-body attn-body">
      <div class="attn-view"><div id="attn-3d" class="fill"></div><canvas id="attn-canvas" class="fill" hidden></canvas></div>
      <canvas id="growth-canvas" class="growth"></canvas>
    </div>
  </section>

  <aside id="side">
    <div id="pane"></div>
    <div id="inspector" class="inspector"></div>
  </aside>

  <section id="logits" class="viewport">
    <div class="vp-title">Логиты <span id="logits-sub"></span></div>
    <div class="vp-body"><canvas id="logits-canvas"></canvas><div id="tip" class="tip" hidden></div></div>
  </section>

  <section id="story" class="viewport">
    <div class="vp-title">Вход и выход <span id="story-sub"></span></div>
    <div class="vp-body"><div id="story-text" class="story-text"></div></div>
    <div id="timeline" class="timeline">
      <button id="t-first" title="В начало ответа (Home)"><svg viewBox="0 0 16 16"><rect x="2.5" y="3" width="1.8" height="10" rx="0.6"/><path d="M13 3.6v8.8a.6.6 0 0 1-.92.5L5.6 8.5a.6.6 0 0 1 0-1l6.48-4.4a.6.6 0 0 1 .92.5z"/></svg></button>
      <button id="t-prev" title="Шаг назад (←)"><svg viewBox="0 0 16 16"><path d="M11.5 3.6v8.8a.6.6 0 0 1-.92.5L4.1 8.5a.6.6 0 0 1 0-1l6.48-4.4a.6.6 0 0 1 .92.5z"/></svg></button>
      <button id="t-play" title="Проиграть / пауза (пробел)"><svg viewBox="0 0 16 16"><path d="M5 3.1v9.8a.7.7 0 0 0 1.06.6l7.7-4.9a.7.7 0 0 0 0-1.2l-7.7-4.9A.7.7 0 0 0 5 3.1z"/></svg></button>
      <button id="t-next" title="Шаг вперёд (→)"><svg viewBox="0 0 16 16"><path d="M4.5 3.6v8.8a.6.6 0 0 0 .92.5L11.9 8.5a.6.6 0 0 0 0-1L5.42 3.1a.6.6 0 0 0-.92.5z"/></svg></button>
      <button id="t-last" title="В конец (End)"><svg viewBox="0 0 16 16"><path d="M3 3.6v8.8a.6.6 0 0 0 .92.5L10.4 8.5a.6.6 0 0 0 0-1L3.92 3.1a.6.6 0 0 0-.92.5z"/><rect x="11.7" y="3" width="1.8" height="10" rx="0.6"/></svg></button>
      <input id="t-range" type="range" min="0" max="0" value="0">
      <span id="t-label" class="mono"></span>
    </div>
  </section>
</div>
<script type="module" src="editor.js"></script>
</body>
</html>

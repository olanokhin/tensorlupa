<script>
// старые ссылки на эксперименты вели на главную (/?w=…&seed=…) — отправляем их в студию с теми же параметрами
(function () {
  var q = new URLSearchParams(location.search);
  var pre = /^\/ru(\/|$)/.test(location.pathname) ? '/ru' : '';
  if (['w', 'p', 'seed', 's', 't', 'k', 'mode'].some(function (k) { return q.has(k); })) location.replace(pre + '/studio' + location.search);

<body>
<header class="bar">

  <nav class="bar-links">

<main>
  <section class="hero">
    <div class="hero-text">
      <h1 data-i18n="land.h1"></h1>
      <p class="lede" data-i18n="land.lede"></p>
      <div class="cta">
        <a class="btn-open" href="studio" data-local data-i18n="land.open"></a>
        <p class="cta-note" data-i18n="land.free"></p>
      </div>
      <div class="phone">
        <p data-i18n="land.phone"></p>
        <div class="phone-row">
          <code class="phone-url">tensorlupa.com</code>
          <button id="copy" class="btn-open btn-small" type="button" data-i18n="land.copy"></button>
          <button id="share" class="btn-ghost btn-small" type="button" data-i18n="land.share" hidden></button>
        </div>
      </div>
    </div>

    <figure class="trace" aria-labelledby="trace-cap">

    </figure>
  </section>

  <section class="counters" id="counters" hidden aria-live="polite">
    <div class="ctr ctr-runs"><span class="ctr-num" data-key="runs">0</span><p class="ctr-label" data-i18n="land.ctr.runs"></p></div>
    <div class="ctr ctr-users"><span class="ctr-num" data-key="users">0</span><p class="ctr-label" data-i18n="land.ctr.users"></p></div>
  </section>

  <section class="film">
    <video src="media/demo.mp4" poster="media/demo-poster.jpg" muted loop playsinline preload="none" id="film"></video>
    <p class="film-cap" data-i18n="land.video.cap"></p>
  </section>

  <section class="see">
    <h2 data-i18n="land.see.h"></h2>
    <div class="see-grid">
      <div><h3 data-i18n="land.see.1.h"></h3><p data-i18n="land.see.1"></p></div>

    <ol class="inst-steps">
      <li><span class="is-n" data-i18n="land.inst.1.n"></span><span class="is-bar"><i style="width:5.7%"></i></span><span data-i18n="land.inst.1"></span></li>

    </ol>
  </section>

  <section class="chain">
    <h2 data-i18n="land.ver.h"></h2>
    <p class="chain-lede" data-i18n="land.ver.lede"></p>
    <ol class="chain-steps chain-6">
      <li><span class="cs-n" data-i18n="land.ver.1.n"></span><h3 data-i18n="land.ver.1.h"></h3><p data-i18n="land.ver.1"></p></li>
      <li><span class="cs-n" data-i18n="land.ver.2.n"></span><h3 data-i18n="land.ver.2.h"></h3><p data-i18n="land.ver.2"></p></li>
      <li><span class="cs-n" data-i18n="land.ver.3.n"></span><h3 data-i18n="land.ver.3.h"></h3><p data-i18n="land.ver.3"></p></li>
      <li><span class="cs-n" data-i18n="land.ver.4.n"></span><h3 data-i18n="land.ver.4.h"></h3><p data-i18n="land.ver.4"></p>

      <li class="here"><span class="cs-n" data-i18n="land.ver.5.n"></span><h3 data-i18n="land.ver.5.h"></h3><p data-i18n="land.ver.5"></p>
        <a class="btn-open btn-small" href="studio?q=8" data-local data-i18n="land.ver.5.open"></a></li>
      <li><span class="cs-n" data-i18n="land.ver.6.n"></span><h3 data-i18n="land.ver.6.h"></h3><p data-i18n="land.ver.6"></p>
        <a class="btn-ghost btn-small" href="studio?q=4" data-local data-i18n="land.ver.6.open"></a>
        <a class="chain-link chain-in" href="flash" data-local data-i18n="land.ver.6.flash"></a>
        <a class="chain-link" href="https://github.com/olanokhin/micro-qwen3-esp32" target="_blank" rel="noopener" data-i18n="land.ver.6.link"></a></li>

<script>
// язык задаёт адрес: /ru/… — русский, иначе английский (как в студии и Docs); тексты до первой отрисовки
(function () {
  var D = window.MQ_DICTS || {};
  var L = /^\/ru(\/|$)/.test(location.pathname) && D.ru ? 'ru' : 'en';
  window.MQ_LANG = L; window.MQ_PREFIX = L === 'en' ? '' : L + '/';
  document.querySelectorAll('a[data-local]').forEach(function (a) { if (window.MQ_PREFIX && a.getAttribute('href').indexOf(window.MQ_PREFIX) !== 0) a.setAttribute('href', window.MQ_PREFIX + a.getAttribute('href').replace(/^\.\//, '')); });
  var d = D[window.MQ_LANG] || {}, en = D.en || {};
  function g(k) { var v = d[k] !== undefined ? d[k] : en[k]; return typeof v === 'string' ? v : k; }
  document.documentElement.lang = window.MQ_LANG;
  document.title = g('land.title');
  document.querySelectorAll('[data-i18n]').forEach(function (e) { e.textContent = g(e.dataset.i18n); });
  document.querySelectorAll('[data-i18n-title]').forEach(function (e) { e.title = g(e.dataset.i18nTitle); });
})();
</script>
